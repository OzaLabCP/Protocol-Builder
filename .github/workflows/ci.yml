name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        # Each test file is a self-contained runner (no network / no API key). Fail the
        # job if any file reports a failure.
        run: |
          fail=0
          for t in tests/test_*.py; do
            echo "=== $t ==="
            python "$t" || fail=1
          done
          exit $fail
