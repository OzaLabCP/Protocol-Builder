name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv venv --python 3.11

      - name: Install (editable, with dev extras)
        run: uv pip install -e ".[dev]"

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Type-check (mypy)
        run: uv run mypy src/tessera

      - name: Test (pytest, mock mode / offline)
        run: uv run pytest -q

      # The invariant + license-hygiene tests (spec §14.5, §9) run as part of the
      # suite above; they FAIL CI if a propensity is summed into a ΔG, a per-residue
      # ΔG column appears, or a GPL tool is imported rather than subprocess'd.
